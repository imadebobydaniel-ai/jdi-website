<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Digital Signage - Admin JDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bg-navy-dark { background-color: #0a1d37; }
        .text-accent-orange { color: #ff8c00; }
        .bg-accent-orange { background-color: #ff8c00; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

    <aside class="w-64 bg-navy-dark text-white hidden md:flex flex-col">
        <div class="p-6 border-b border-white/10">
            <img src="logojdi.png" alt="Logo JDI" class="h-10 brightness-200">
            <p class="text-[10px] uppercase tracking-widest mt-2 text-gray-400 font-bold">Admin Panel</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="admin.html" class="flex items-center gap-3 p-3 hover:bg-white/5 rounded-lg transition text-gray-300">
                <span>📊</span> Dashboard
            </a>
            <a href="digital-signage.html" class="flex items-center gap-3 p-3 bg-accent-orange rounded-lg font-bold text-white">
                <span>📺</span> Digital Signage
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="bg-white shadow-sm p-6 flex justify-between items-center">
            <h2 class="text-xl font-bold text-navy-dark">Manajemen Digital Signage</h2>
            <button onclick="window.location.href='admin.html'" class="text-sm font-bold text-gray-500 hover:text-navy-dark">← Kembali</button>
        </header>

        <section class="p-8">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-2xl shadow-sm p-6 border mb-8">
                    <h3 class="font-bold text-navy-dark mb-4">Upload Banner Baru</h3>
                    <form id="signage-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[11px] font-bold text-accent-orange uppercase mb-1">Nama Banner:</label>
                                <input type="text" id="banner-name" placeholder="Misal: Promo Ramadhan" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-accent-orange">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-accent-orange uppercase mb-1">Pilih File Gambar:</label>
                                <input type="file" id="banner-file" accept="image/*" class="w-full p-2 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-sm">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-accent-orange text-white py-3 rounded-xl font-bold text-sm hover:bg-orange-600 transition shadow-lg shadow-orange-100">
                            🚀 Publikasikan ke Digital Signage
                        </button>
                    </form>
                </div>

                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                    <div class="p-4 border-b bg-gray-50">
                        <h3 class="font-bold text-navy-dark text-sm">Banner Aktif di Website</h3>
                    </div>
                    <div class="divide-y" id="signage-list">
                        <div class="p-4 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-20 h-12 bg-gray-200 rounded overflow-hidden">
                                    <img src="bubur-mandala.png" class="w-full h-full object-cover">
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-navy-dark">Banner Bubur Mandala</p>
                                    <p class="text-[10px] text-green-500 font-bold uppercase">Tampil di Utama</p>
                                </div>
                            </div>
                            <button class="text-red-500 text-xs font-bold hover:underline">Hapus</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('signage-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Fitur upload ini memerlukan backend (PHP/Node.js) atau Firebase untuk menyimpan file gambar secara permanen.');
        });
    </script>
</body>
</html>
